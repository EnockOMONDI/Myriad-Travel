# Static files and media configuration
# Note: Render serves static files automatically
# For production media files, consider AWS S3 integration

# Environment-specific notes:
# 1. MAILTRAP_API_TOKEN is hardcoded in settings_prod.py (synchronous HTTP API)
# 2. Set UPLOADCARE_PUBLIC_KEY and UPLOADCARE_SECRET_KEY manually in Render dashboard
# 3. Optional: Set SENTRY_DSN for error monitoring
# 4. Optional: Set GOOGLE_ANALYTICS_ID for analytics
# 5. Consider upgrading to paid plans for production workloads
# 6. Email sending is now synchronous via Mailtrap HTTP API (no background worker needed)

# Deployment checklist:
# ✅ Environment variables configured
# ✅ Database connection established
# ✅ Static files collection enabled
# ✅ Health checks configured
# ✅ Auto-deployment enabled
# ✅ Security headers configured
# ✅ Performance optimizations applied
