services:
  # Web service for Mbugani Luxe Adventures# Web service for Mbugani Luxe Adventures
  - type: web
    name: Mbuganiapp
    env: python
    region: frankfurt
    plan: starter
    branch: mugani2026b
    buildCommand: |
      echo "🚀 Starting Mbugani Luxe Adventures build process..."
      pip install --upgrade pip
      pip install -r requirements.txt
      echo "📦 Dependencies installed successfully"
      python manage.py collectstatic --noinput --settings=tours_travels.settings_prod
      echo "📁 Static files collected"
      python manage.py migrate --settings=tours_travels.settings_prod
      echo "🗄️ Database migrations applied"
      python manage.py createcachetable --settings=tours_travels.settings_prod
      echo "💾 Cache table created"
      echo "✅ Build completed successfully"
    startCommand: |
      echo "🌟 Starting Mbugani Luxe Adventures web server..."
      gunicorn tours_travels.wsgi:application \
        --bind 0.0.0.0:$PORT \
        --workers $WEB_CONCURRENCY \
        --timeout $GUNICORN_TIMEOUT \
        --worker-class sync \
        --worker-connections 1000 \
        --max-requests 1000 \
        --max-requests-jitter 100 \
        --preload \
        --access-logfile - \
        --error-logfile - \
        --log-level info
    envVars:
      # Django Core Configuration
      - key: DJANGO_SETTINGS_MODULE
        value: false # Set manually in Render dashboard - see .env.secrets
      # NOTE: DJANGO_ENV removed to match Novustell's simple architecture
      - key: PYTHON_VERSION
        value: 3.12.0
      # CRITICAL SECRETS - Must be set manually in Render dashboard
      # See .env.secrets file for actual values
      - key: SECRET_KEY
        sync: false  # Set manually in Render dashboard - see .env.secrets
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard - see .env.secrets

      # Non-secret configuration
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: false # Set manually in Render dashboard - see .env.secrets
      - key: DB_CONN_MAX_AGE
        value: 600
      - key: DB_CONN_HEALTH_CHECKS
        value: True

      # Server Configuration
      - key: PORT
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 3
      - key: GUNICORN_WORKERS
        value: 3
      - key: GUNICORN_TIMEOUT
        value: 240
      - key: RENDER_EXTERNAL_HOSTNAME
        generateValue: true

      # Email Configuration (Mailtrap HTTP API)
      - key: MAILTRAP_API_TOKEN
        sync: false  # Set manually in Render dashboard - see .env.secrets
      - key: DEFAULT_FROM_EMAIL
        value: false # Set manually in Render dashboard - see .env.secrets
      - key: ADMIN_EMAIL
        value: false # Set manually in Render dashboard - see .env.secrets
      - key: JOBS_EMAIL
        value: false # Set manually in Render dashboard - see .env.secrets
      - key: NEWSLETTER_EMAIL
        value: false # Set manually in Render dashboard - see .env.secrets

      # Uploadcare Configuration - CRITICAL SECRETS
      - key: UPLOADCARE_PUBLIC_KEY
        sync: false  # Set manually in Render dashboard - see .env.secrets
      - key: UPLOADCARE_SECRET_KEY
        sync: false  # Set manually in Render dashboard - see .env.secrets

      # Site Configuration
      - key: SITE_URL
        value: false # Set manually in Render dashboard - see .env.secrets
      - key: WHATSAPP_PHONE
        value: false # Set manually in Render dashboard - see .env.secrets

      # Security Configuration
      - key: SECURE_SSL_REDIRECT
        value: True
      - key: SECURE_HSTS_SECONDS
        value: 31536000
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: True
      - key: SECURE_HSTS_PRELOAD
        value: True
      - key: SESSION_COOKIE_SECURE
        value: True
      - key: CSRF_COOKIE_SECURE
        value: True
      - key: SESSION_COOKIE_HTTPONLY
        value: True
      - key: CSRF_COOKIE_HTTPONLY
        value: True

      # Performance Configuration
      - key: FILE_UPLOAD_MAX_MEMORY_SIZE
        value: 5242880
      - key: DATA_UPLOAD_MAX_MEMORY_SIZE
        value: 5242880
      - key: SESSION_COOKIE_AGE
        value: 86400

      # Feature Flags
      - key: ENABLE_BOOKING_NOTIFICATIONS
        value: True
      - key: ENABLE_EMAIL_MARKETING
        value: True
      - key: ENABLE_ANALYTICS
        value: True
      - key: ENABLE_CHAT_SUPPORT
        value: False

      # Business Configuration
      - key: DEFAULT_BOOKING_EXPIRY_HOURS
        value: 24
      - key: MAX_BOOKING_ADULTS
        value: 20
      - key: MAX_BOOKING_CHILDREN
        value: 15
      - key: MAX_BOOKING_ROOMS
        value: 10

      # Regional Settings
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: DEFAULT_LANGUAGE
        value: en
      - key: DEFAULT_COUNTRY
        value: Kenya
      - key: DEFAULT_CURRENCY
        value: USD

      # Monitoring (Optional - set manually if needed)
      # - key: SENTRY_DSN
      #   sync: false
      # - key: GOOGLE_ANALYTICS_ID
      #   sync: false

    healthCheckPath: /health/
    autoDeploy: true
    disk:
      name: novustell-disk
      mountPath: /opt/render/project/src/media
      sizeGB: 1

  # Django-Q Background Worker moved to Railway.app
  # Worker service now runs on Railway for better resource management


# External Database Configuration
# Using Supabase PostgreSQL database (configured via DATABASE_URL environment variable)
# No database creation needed as we're using external Supabase service

# databases:
