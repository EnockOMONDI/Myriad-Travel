{% load static %}
<div
  class="destination-card group relative rounded-2xl overflow-hidden bg-slate-900 aspect-4/3 cursor-pointer shadow-md hover:shadow-2xl transition-all duration-300 hover:-translate-y-1"
  data-destination-name="{{ dest.name }}"
>
  <!-- Background Image -->
  <img
    src="{{ dest.image }}"
    alt="{{ dest.name }}"
    class="w-full h-full object-cover group-hover:scale-108 transition-transform duration-700 ease-out opacity-85 group-hover:opacity-100"
    loading="lazy"
  />
  <!-- Dark gradient overlay -->
  <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>

  <!-- Badge Top Right -->
  <div class="absolute top-4 right-4">
    <span class="px-3 py-1 bg-white/20 backdrop-blur-md text-white text-[11px] font-bold rounded-full border border-white/20 shadow-xs">
      {{ dest.badge|default:"Featured" }}
    </span>
  </div>

  <!-- Content Bottom -->
  <div class="absolute bottom-0 inset-x-0 p-5 sm:p-6 text-white space-y-2">
    <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider flex items-center gap-1">
      <i data-lucide="map-pin" class="w-3 h-3"></i>
      <span>{{ dest.country|default:"Kenya" }}</span>
    </span>

    <h3 class="text-xl sm:text-2xl font-bold font-serif leading-tight group-hover:text-amber-300 transition-colors">
      {{ dest.name }}
    </h3>

    <p class="text-xs text-slate-200 line-clamp-2 leading-relaxed">
      {{ dest.description }}
    </p>

    <!-- Popular tags -->
    <div class="flex flex-wrap items-center gap-1.5 pt-2 border-t border-white/15">
      {% for tag in dest.popular_for %}
      <span class="text-[10px] bg-black/40 text-slate-200 px-2 py-0.5 rounded-md font-medium">
        {{ tag }}
      </span>
      {% endfor %}
    </div>

    <!-- Link prompt -->
    <div class="pt-2 flex items-center justify-between text-xs font-semibold text-amber-300 opacity-90 group-hover:opacity-100 transition-opacity">
      <span>View Tours &amp; Safaris</span>
      <i data-lucide="arrow-right" class="w-4 h-4 transform group-hover:translate-x-1 transition-transform"></i>
    </div>
  </div>
</div>
