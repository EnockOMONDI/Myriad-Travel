{% load static %}
<div
  class="destination-card group relative overflow-hidden rounded-2xl bg-white aspect-4/3 cursor-pointer border border-[#c7f0ec] shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-1"
  data-destination-name="{{ dest.name }}"
>
  <!-- Background Image -->
  <img
    src="{{ dest.image }}"
    alt="{{ dest.name }}"
    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out"
    loading="lazy"
  />
  <div class="absolute inset-0 bg-gradient-to-t from-black/55 via-black/10 to-transparent"></div>

  <!-- Badge Top Right -->
  <div class="absolute top-4 right-4">
    <span class="px-3 py-1 bg-white/90 text-[#1abdaf] text-[11px] font-bold rounded-full shadow-xs">
      {{ dest.badge|default:"Featured" }}
    </span>
  </div>

  <!-- Content Bottom -->
  <div class="absolute bottom-0 inset-x-0 p-5 text-white space-y-2">
    <span class="text-[11px] font-bold text-white/85 uppercase tracking-wider flex items-center gap-1">
      <i data-lucide="map-pin" class="w-3 h-3"></i>
      <span>{{ dest.country|default:"Kenya" }}</span>
    </span>

    <h3 class="text-xl sm:text-2xl font-bold font-serif leading-tight group-hover:text-white transition-colors">
      {{ dest.name }}
    </h3>

    {% if dest.popular_for %}
      <div class="flex flex-wrap items-center gap-1.5 pt-2 border-t border-white/15">
        {% for tag in dest.popular_for|slice:":3" %}
          <span class="text-[10px] bg-black/40 text-slate-100 px-2 py-0.5 rounded-md font-medium">{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}

    <div class="pt-1 flex items-center justify-between text-xs font-bold text-white opacity-90 group-hover:opacity-100 transition-opacity">
      <span>View trips</span>
      <i data-lucide="arrow-right" class="w-4 h-4 transform group-hover:translate-x-1 transition-transform"></i>
    </div>
  </div>
</div>
