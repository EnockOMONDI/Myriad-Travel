{% extends 'base.html' %}
{% block title %}Login — Myriad Travel{% endblock %}
{% block content %}
<section class="py-16 px-4 sm:px-8 max-w-md mx-auto">
  <h1 class="text-3xl font-bold font-serif text-slate-900 mb-2">Welcome Back</h1>
  <p class="text-slate-600 mb-8">Access your Myriad bookings, profile, and saved travel plans.</p>
  <form method="post" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">{% csrf_token %}{{ form.as_p }}<button class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl">Login</button></form>
  <p class="text-sm text-slate-600 mt-6">New here? <a class="text-amber-700 font-semibold" href="{% url 'users:users-register' %}">Create an account</a></p>
</section>
{% endblock %}
