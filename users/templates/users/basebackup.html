{% load static %}
<!DOCTYPE html>
<html lang="zxx">
    
<!-- Mbugani Luxe Adventures - Luxury Safari & Adventure Tourism -->
<head>
        <!--====== Required meta tags ======-->
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <meta name="description" content="{% block meta_description %}Mbugani Luxe Adventures - Premier luxury safari and adventure tourism in Kenya. Experience untamed wilderness with unmatched comfort. Luxury safaris, cultural journeys, bespoke getaways, and exclusive services in Kenya's most iconic destinations.{% endblock %}">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!--====== Resource Hints for Performance ======-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
        <link rel="dns-prefetch" href="https://wati-integration-prod-service.clare.ai">

        <!--====== Title ======-->
        <title>{% block title %}Mbugani Luxe Adventures | Luxury Safari & Adventure Tourism | Premium Kenya Safari Experiences{% endblock %}</title>

        {% block extra_head %}{% endblock %}
        <!--====== Favicon Icon ======-->

        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'assets/images/favicon_io/apple-touch-icon.png' %}">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'assets/images/favicon_io/favicon-32x32.png' %}">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'assets/images/favicon_io/favicon-16x16.png' %}">
        <link rel="manifest" href="{% static 'assets/images/favicon_io/site.webmanifest' %}">
        <!--====== Google Fonts ======-->
        <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">

        <!--====== Mbugani Luxe Adventures Global Color Scheme ======-->
        <style>
            :root {
                /* === MBUGANI LUXE ADVENTURES BRAND COLORS === */
                --primary-color: #471601; /* Mbugani burgundy/dark red */
                --secondary-color: #e3aa00; /* Mbugani orange */
                --primary-hover: #3a1201; /* Darker burgundy for hover */
                --secondary-hover: #d19900; /* Darker orange for hover */
                --primary-light: #5a1d02; /* Lighter burgundy */
                --secondary-light: #f0b84d; /* Lighter orange */

                /* Text Colors */
                --text-dark: #2c2c2c;
                --text-light: #ffffff;
                --text-muted: #6c757d;
                --text-primary: var(--primary-color);

                /* Background Colors */
                --background-light: #ffffff;
                --background-dark: #1a1a1a;
                --background-gray: #f8f9fa;
                --background-primary: var(--primary-color);
                --background-secondary: var(--secondary-color);

                /* Border and Shadow Colors */
                --border-color: #e5e5e5;
                --border-light: #f0f0f0;
                --shadow-color: rgba(71, 22, 1, 0.15);
                --shadow-light: rgba(0, 0, 0, 0.1);
                --shadow-dark: rgba(0, 0, 0, 0.3);

                /* Status Colors */
                --success-color: #28a745;
                --warning-color: #ffc107;
                --danger-color: #dc3545;
                --info-color: #17a2b8;

                /* Gradient Colors */
                --gradient-primary: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
                --gradient-secondary: linear-gradient(135deg, var(--secondary-color) 0%, var(--secondary-light) 100%);
                --gradient-hero: linear-gradient(135deg, rgba(71, 22, 1, 0.8) 0%, rgba(227, 170, 0, 0.8) 100%);
            }

            /* === GLOBAL COLOR OVERRIDES === */
            .text-primary { color: var(--primary-color) !important; }
            .text-secondary { color: var(--secondary-color) !important; }
            .bg-primary { background-color: var(--primary-color) !important; }
            .bg-secondary { background-color: var(--secondary-color) !important; }
            .border-primary { border-color: var(--primary-color) !important; }
            .border-secondary { border-color: var(--secondary-color) !important; }

            /* === BUTTON COLOR UPDATES === */
            .btn-primary, .main-btn.primary-btn {
                background-color: var(--primary-color) !important;
                border-color: var(--primary-color) !important;
                color: var(--text-light) !important;
                transition: all 0.3s ease !important;
            }

            .btn-primary:hover, .main-btn.primary-btn:hover,
            .btn-primary:focus, .main-btn.primary-btn:focus {
                background-color: var(--primary-hover) !important;
                border-color: var(--primary-hover) !important;
                color: var(--text-light) !important;
                transform: translateY(-2px) !important;
                box-shadow: 0 5px 15px var(--shadow-color) !important;
            }

            .btn-secondary, .main-btn.secondary-btn {
                background-color: var(--secondary-color) !important;
                border-color: var(--secondary-color) !important;
                color: var(--text-light) !important;
                transition: all 0.3s ease !important;
            }

            .btn-secondary:hover, .main-btn.secondary-btn:hover,
            .btn-secondary:focus, .main-btn.secondary-btn:focus {
                background-color: var(--secondary-hover) !important;
                border-color: var(--secondary-hover) !important;
                color: var(--text-light) !important;
                transform: translateY(-2px) !important;
                box-shadow: 0 5px 15px rgba(227, 170, 0, 0.3) !important;
            }

            /* === LINK COLOR UPDATES === */
            a {
                color: var(--primary-color);
                transition: color 0.3s ease;
            }

            a:hover, a:focus {
                color: var(--primary-hover);
                text-decoration: none;
            }

            /* === HEADING COLOR UPDATES === */
            h1, h2, h3, h4, h5, h6 {
                color: var(--text-dark);
            }

            .display-4, .section-title h1, .section-title h2,
            .hero-title, .page-title {
                color: var(--primary-color) !important;
            }

            /* === FORM ELEMENT COLORS === */
            .form-control:focus, .form_control:focus {
                border-color: var(--primary-color) !important;
                box-shadow: 0 0 0 0.2rem rgba(71, 22, 1, 0.25) !important;
            }

            .form-check-input:checked {
                background-color: var(--primary-color) !important;
                border-color: var(--primary-color) !important;
            }

            /* === NAVIGATION COLORS === */
            .navbar-brand, .site-branding a {
                color: var(--primary-color) !important;
            }

            .nav-link {
                color: var(--text-dark) !important;
                transition: color 0.3s ease !important;
            }

            .nav-link:hover, .nav-link:focus {
                color: var(--primary-color) !important;
            }

            .nav-link.active {
                color: var(--primary-color) !important;
                font-weight: 600 !important;
            }

            /* === MOBILE MENU BODY LOCK === */
            body.menu-open {
                overflow: hidden;
            }
        </style>

        <!--====== TAN-Garland Custom Fonts ======-->
        <link rel="stylesheet" href="{% static 'css/tan-garland-fonts.css' %}">
        <!--====== Flaticon css ======-->
        <link rel="stylesheet" href="{% static 'assets/fonts/flaticon/flaticon_gowilds.css' %}">
        <!--====== FontAwesome css ======-->
        <link rel="stylesheet" href="{% static 'assets/fonts/fontawesome/css/all.min.css' %}">
        <!--====== Bootstrap css ======-->
        <link rel="stylesheet" href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}">
        <!--====== magnific-popup css ======-->
        <link rel="stylesheet" href="{% static 'assets/vendor/magnific-popup/dist/magnific-popup.css' %}">
        <!--====== Slick-popup css ======-->
        <link rel="stylesheet" href="{% static 'assets/vendor/slick/slick.css' %}">
        <!--====== Jquery UI css ======-->
        <link rel="stylesheet" href="{% static 'assets/vendor/jquery-ui/jquery-ui.min.css' %}">
        <!--====== Nice Select css ======-->
        <link rel="stylesheet" href="{% static 'assets/vendor/nice-select/css/nice-select.css' %}">
        <!--====== Animate css ======-->
        <link rel="stylesheet" href="{% static 'assets/vendor/animate.css' %}">
        <!--====== Default css ======-->
        <link rel="stylesheet" href="{% static 'assets/css/default.css' %}">
        <!--====== Style css ======-->
        <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
        <link rel="stylesheet" href="{% static 'assets/css/content-buttons.css' %}">
    </head>
    <body style="background-color: #fcf8f4;">
       
          <!--====== Start Preloader ======-->
          <div class="preloader">
            <div class="loader">
                <div class="preloader-logo">
                    <img src="{% static 'assets/images/logo/mbuganipreloader.svg' %}" alt="Mbugani Luxe Adventures" />
                </div>
            </div>
        </div><!--====== End Preloader ======-->
        {% include 'users/navbarbackup.html' %}

        <main class="site-content">
        {% block content %}



        {% endblock %}
        </main>

        <!--====== Start Footer ======-->
        {% include 'users/footer.html' %}
        <!--====== End Footer ======-->

        <!--====== jQuery (Load First) ======-->
        <script src="{% static 'assets/vendor/jquery-3.6.0.min.js' %}"></script>

        <!--====== Bootstrap js ======-->
        <script src="{% static 'assets/vendor/popper/popper.min.js' %}"></script>
        <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.min.js' %}"></script>

        <!--====== Slick js (Load after jQuery) ======-->
        <script src="{% static 'assets/vendor/slick/slick.min.js' %}"></script>

        <!--====== WOW js (Load before theme.js) ======-->
        <script src="{% static 'assets/vendor/wow.min.js' %}"></script>

        <!--====== Other jQuery plugins ======-->
        <script defer src="{% static 'assets/vendor/magnific-popup/dist/jquery.magnific-popup.min.js' %}"></script>
        <script defer src="{% static 'assets/vendor/isotope.min.js' %}"></script>
        <script defer src="{% static 'assets/vendor/imagesloaded.min.js' %}"></script>
        <script defer src="{% static 'assets/vendor/jquery.counterup.min.js' %}"></script>
        <script defer src="{% static 'assets/vendor/jquery.waypoints.js' %}"></script>
        <script defer src="{% static 'assets/vendor/nice-select/js/jquery.nice-select.min.js' %}"></script>
        <script defer src="{% static 'assets/vendor/jquery-ui/jquery-ui.min.js' %}"></script>

        <!--====== Main js (Load after WOW.js) ======-->
        <script src="{% static 'assets/js/theme.js' %}"></script>
    </body>

<!-- End Mbugani Luxe Adventures Website -->
</html>
