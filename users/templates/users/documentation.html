{% extends 'base.html' %}
{% block title %}Project Dashboard — Myriad Travel{% endblock %}
{% block content %}<section class="py-16 px-4 sm:px-8 max-w-7xl mx-auto"><h1 class="text-3xl font-bold font-serif mb-8">{{ page_title }}</h1><div class="grid md:grid-cols-3 gap-4">{% for key,value in stats.items %}<div class="bg-white border border-slate-200 rounded-2xl p-5"><span class="text-xs uppercase text-slate-500">{{ key }}</span><strong class="block text-2xl">{{ value }}</strong></div>{% endfor %}</div></section>{% endblock %}
