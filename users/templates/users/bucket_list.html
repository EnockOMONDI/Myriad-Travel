{% extends 'base.html' %}
{% block title %}Bucket List — Myriad Travel{% endblock %}
{% block content %}<section class="py-16 px-4 sm:px-8 max-w-5xl mx-auto"><h1 class="text-3xl font-bold font-serif mb-8">My Bucket List</h1><div class="grid md:grid-cols-2 gap-4">{% for item in bucket_list %}<div class="bg-white border border-slate-200 rounded-2xl p-5"><strong>{{ item }}</strong><p class="text-sm text-slate-500 mt-1">{{ item.notes }}</p></div>{% empty %}<div class="bg-white border border-slate-200 rounded-2xl p-8 text-slate-600">No saved ideas yet.</div>{% endfor %}</div></section>{% endblock %}
