{% extends 'base.html' %}
{% block title %}Change Password — Myriad Travel{% endblock %}
{% block content %}<section class="py-16 px-4 sm:px-8 max-w-xl mx-auto"><h1 class="text-3xl font-bold font-serif mb-8">Change Password</h1><form method="post" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">{% csrf_token %}{{ form.as_p }}<button class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl">Update Password</button></form></section>{% endblock %}
