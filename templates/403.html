{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Restricted | Myriad Travel</title>
    <link rel="icon" type="image/png" href="{% static 'images/myriad-logo.png' %}">
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f9f2f2; color: #0b192c; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(92vw, 720px); padding: 48px 28px; text-align: center; }
      img { width: 116px; height: auto; margin-bottom: 24px; }
      .code { color: #d97706; font-size: clamp(4rem, 18vw, 8rem); line-height: .9; font-weight: 800; }
      h1 { margin: 18px 0 12px; font-size: clamp(1.7rem, 5vw, 2.6rem); }
      p { margin: 0 auto 28px; max-width: 560px; color: #475569; line-height: 1.7; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #d97706; color: #fff; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="{% static 'images/myriad-logo.png' %}" alt="Myriad Travel">
      <div class="code">403</div>
      <h1>This area is restricted.</h1>
      <p>You do not have permission to view this page. Sign in with the right account or contact the Myriad Travel team if you need access.</p>
      <a href="/">Back to Home</a>
    </main>
  </body>
</html>
